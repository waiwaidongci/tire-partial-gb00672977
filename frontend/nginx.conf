server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1200k;
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /src/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
